name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "^refs/tags/", ""
          } else {
            $tag = "v0.0.0-dev"
          }
          $version = $tag -replace "^v", ""
          $numericVersion = ($version -split "-")[0]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "numericVersion=$numericVersion" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish AnalogClock.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.numericVersion }} -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Copy license into publish output
        shell: pwsh
        run: Copy-Item LICENSE publish\LICENSE

      - name: Create output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "dist\AnalogClock-${{ steps.version.outputs.tag }}-win-x64-portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.numericVersion }} `
            /DSourceDir="${{ github.workspace }}\publish" `
            /DOutputDir="${{ github.workspace }}\dist" `
            installer\setup.iss
          Rename-Item -Path "dist\AnalogClock-${{ steps.version.outputs.numericVersion }}-win-x64-setup.exe" -NewName "AnalogClock-${{ steps.version.outputs.tag }}-win-x64-setup.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: dist/*
