name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "^refs/tags/", ""
          } else {
            $tag = "v0.0.0-dev"
          }
          $version = $tag -replace "^v", ""
          $numericVersion = ($version -split "-")[0]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "numericVersion=$numericVersion" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish AnalogClock.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.numericVersion }} -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Copy license into publish output
        shell: pwsh
        run: Copy-Item LICENSE publish\LICENSE

      - name: Create output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "dist\AnalogClock-${{ steps.version.outputs.tag }}-win-x64-portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.numericVersion }} `
            /DSourceDir="${{ github.workspace }}\publish" `
            /DOutputDir="${{ github.workspace }}\dist" `
            installer\setup.iss
          Rename-Item -Path "dist\AnalogClock-${{ steps.version.outputs.numericVersion }}-win-x64-setup.exe" -NewName "AnalogClock-${{ steps.version.outputs.tag }}-win-x64-setup.exe"

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AnalogClock-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
